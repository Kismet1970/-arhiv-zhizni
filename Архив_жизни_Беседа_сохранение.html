<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Архив жизни — Мобильный учебник</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;color:#171717;background:#f5f5f7}
*{box-sizing:border-box} body{margin:0;background:#f5f5f7}
main{max-width:760px;margin:auto;padding:18px 16px 40px}
h1{font-size:25px;margin:8px 0 5px} h2{font-size:20px;margin:20px 0 10px}
.panel{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 5px #00000012}
button{border:0;border-radius:12px;padding:12px 15px;font-size:16px;background:#111;color:#fff;margin:6px 6px 0 0}
button.secondary{background:#e9e9ed;color:#111}.item{display:flex;align-items:center;gap:10px;padding:14px 2px;border-bottom:1px solid #eee}
.icon{font-size:22px;width:28px;text-align:center}.name{flex:1;font-size:16px}.small{font-size:13px;color:#666}
.status{padding:11px 13px;border-radius:12px;background:#eee;margin-top:12px;white-space:pre-wrap}
.error{background:#ffe9e9;color:#8b0000}.answer{display:none;margin-top:15px;padding-top:15px;border-top:1px solid #eee}
.answer-label{font-size:13px;color:#666;margin-bottom:5px}.deck-title{font-size:22px;font-weight:700}
.example{font-size:19px;line-height:1.45;margin-top:16px}.translation{font-size:17px;line-height:1.45;margin-top:10px;color:#555}
audio{width:100%;margin-top:15px}.progress{font-size:13px;color:#666}.hidden{display:none}
.prompt{font-size:19px;line-height:1.45;margin-top:16px}
.card-image{display:none;width:100%;max-height:430px;object-fit:contain;margin-top:16px;border-radius:12px;background:#f0f0f2}.card-image.visible{display:block}

.chat-box{display:none;position:fixed;inset:0;background:#f5f5f7;z-index:50;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);}
.chat-inner{max-width:760px;height:100%;margin:auto;display:flex;flex-direction:column;}
.chat-head{display:flex;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid #ddd;}
.chat-title{flex:1;font-size:18px;font-weight:700;}
.chat-messages{flex:1;overflow:auto;padding:12px 2px;}
.msg{max-width:88%;padding:11px 13px;border-radius:15px;margin:8px 0;white-space:pre-wrap;line-height:1.42;}
.msg.user{margin-left:auto;background:#111;color:#fff;border-bottom-right-radius:5px;}
.msg.ai{margin-right:auto;background:#fff;border-bottom-left-radius:5px;box-shadow:0 1px 4px #00000010;}
.chat-compose{display:flex;gap:8px;padding:8px 0 calc(8px + env(safe-area-inset-bottom));}
.chat-input{flex:1;min-height:46px;max-height:130px;resize:none;border:1px solid #ccc;border-radius:14px;padding:11px 12px;font:inherit;background:#fff;}
.chat-send{margin:0;min-width:82px;}
.chat-empty{color:#666;text-align:center;padding:30px 20px;}
.chat-settings{padding:8px 0;border-bottom:1px solid #ddd;}
.chat-settings summary{font-size:13px;color:#666;cursor:pointer;}
.chat-key{width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;margin-top:8px;font:inherit;}
.chat-hint{font-size:12px;color:#666;margin-top:6px;line-height:1.35;}
</style>
</head>
<body>
<main>
<h1>Архив жизни</h1>
<div class="small">Мобильный учебник</div>

<section id="browser" class="panel">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
    <h2 id="locationTitle">КОЛОДЫ</h2>
    <button id="upBtn" class="secondary">Назад</button>
  </div>
  <div id="items"></div>
  <div id="status" class="status">Загружаю колоды…</div>
</section>

<section id="study" class="panel hidden">
  <div class="progress" id="progress"></div>
  <div class="deck-title" id="cardTitle"></div>
  <div class="small" id="cardMeta"></div>
  <img id="cardImage" class="card-image" alt="" referrerpolicy="no-referrer">
  <div id="prompt" class="prompt"></div>
  <audio id="audio" controls preload="metadata"></audio>
  <div id="answer" class="answer">
    <div class="answer-label">Ответ</div>
    <div id="answerText"></div>
  </div>
  <div style="margin-top:12px">
    <button id="showBtn">Показать ответ</button>
    <button id="repeatBtn" class="secondary">Повторить</button>
    <button id="knowBtn">Знаю</button>
    <button id="aiBtn" class="secondary">Беседа с ИИ</button>
  </div>
  <div>
    <button id="prevBtn" class="secondary">←</button>
    <button id="nextBtn">→</button>
    <button id="backDeckBtn" class="secondary">К колодам</button>
  </div>
</section>

<section id="chatBox" class="chat-box">
  <div class="chat-inner">
    <div class="chat-head">
      <button id="chatClose" class="secondary">Закрыть</button>
      <div id="chatTitle" class="chat-title">Беседа с ИИ</div>
      <button id="chatClear" class="secondary">Очистить</button>
    </div>
    <details class="chat-settings">
      <summary>Подключение ИИ</summary>
      <input id="apiKey" class="chat-key" type="password" placeholder="Вставьте ключ OpenRouter">
      <div class="chat-hint">Ключ не записывается в файл и не отправляется в GitHub. В этой версии он хранится только до закрытия вкладки.</div>
    </details>
    <div id="chatMessages" class="chat-messages"></div>
    <div class="chat-compose">
      <textarea id="chatInput" class="chat-input" placeholder="Напишите вопрос по карточке…"></textarea>
      <button id="chatSend" class="chat-send">Отправить</button>
    </div>
  </div>
</section>
</main>

<script>
(() => {
const OWNER='Kismet1970', REPO='-arhiv-zhizni', BRANCH='main', DECK_ROOT='decks';
const API_ROOT=`https://api.github.com/repos/${OWNER}/${REPO}/contents/`;
const SITE_ROOT=`https://${OWNER.toLowerCase()}.github.io/${REPO}/`;

let currentPath=DECK_ROOT,pathStack=[],deck=null,cards=[],index=0;
const $=id=>document.getElementById(id);

function setStatus(msg,error=false){
  $('status').textContent=msg;
  $('status').className='status'+(error?' error':'');
}
function encodePath(path){return path.split('/').map(encodeURIComponent).join('/');}
async function githubJSON(path){
  const r=await fetch(API_ROOT+encodePath(path)+`?ref=${encodeURIComponent(BRANCH)}`,{
    cache:'no-store',headers:{'Accept':'application/vnd.github+json'}
  });
  if(!r.ok){
    if(r.status===404) throw new Error('Папка «decks» ещё не создана.');
    if(r.status===403) throw new Error('GitHub временно ограничил число запросов. Попробуйте позже.');
    throw new Error('GitHub: HTTP '+r.status);
  }
  return await r.json();
}
async function loadFolder(path,title){
  currentPath=path;$('locationTitle').textContent=title;$('items').innerHTML='';setStatus('Загрузка…');
  try{renderFolder(await githubJSON(path));setStatus('Колоды доступны.')}
  catch(e){$('items').innerHTML='';setStatus(e.message||String(e),true)}
}
function renderFolder(items){
  const visible=items.filter(x=>x.type==='dir'||(x.type==='file'&&/\.json$/i.test(x.name)))
    .sort((a,b)=>a.type!==b.type?(a.type==='dir'?-1:1):(a.name||'').localeCompare(b.name||'','ru'));
  if(!visible.length){$('items').innerHTML='<div class="small">Здесь пока нет колод.</div>';return;}
  for(const item of visible){
    const row=document.createElement('div');row.className='item';
    const icon=document.createElement('div');icon.className='icon';icon.textContent=item.type==='dir'?'📁':'📚';
    const name=document.createElement('div');name.className='name';name.textContent=item.name;
    const small=document.createElement('div');small.className='small';small.textContent=item.type==='dir'?'Папка':'JSON-колода';
    name.appendChild(small);row.append(icon,name);
    row.addEventListener('click',()=>{
      if(item.type==='dir'){pathStack.push({path:currentPath,title:$('locationTitle').textContent});loadFolder(item.path,item.name)}
      else openDeck(item.path,item.name,item.download_url);
    });
    $('items').appendChild(row);
  }
}
$('upBtn').addEventListener('click',()=>{
  if(!pathStack.length)return;
  const prev=pathStack.pop();loadFolder(prev.path,prev.title);
});

async function openDeck(path,name,downloadUrl){
  setStatus('Загружаю колоду…');
  try{
    // Для файлов используем прямой download_url, который GitHub
    // возвращает вместе с записью файла. Это корректно работает
    // с кириллицей, пробелами и другими символами в имени.
    const url=downloadUrl || (SITE_ROOT+encodePath(path));
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok)throw new Error('Загрузка JSON: HTTP '+r.status);
    const data=await r.json();
    if(data.format!=='my-knowledge-deck-v1'||!Array.isArray(data.cards))
      throw new Error('Файл загружен, но это не колода формата my-knowledge-deck-v1.');
    deck=data;cards=data.cards;index=0;
    if(!cards.length)throw new Error('Колода пустая.');
    $('browser').classList.add('hidden');$('study').classList.remove('hidden');showCard();
  }catch(e){setStatus('Не удалось загрузить колоду.\n\n'+(e.message||String(e)),true)}
}

function showCard(){
  if(!cards.length)return;
  const c=cards[index]||{};
  const isAudioCard=c.cardType==='audio';
  $('progress').textContent=(deck.name||'Колода')+' · '+(index+1)+' / '+cards.length;
  $('cardTitle').textContent=c.title||'';

  // Для художественных карточек: художник, дата и музей.
  // Для языковых карточек сохраняем прежнюю схему.
  $('cardMeta').textContent = c.artist
    ? [c.artist,c.date,c.museum].filter(Boolean).join(' · ')
    : [c.work,c.author,c.fame].filter(Boolean).join(' · ');

  // Показываем изображение, если в карточке есть поле image.
  const imageUrl = typeof c.image==='string' ? c.image.trim() : '';
  $('cardImage').classList.remove('visible');
  $('cardImage').removeAttribute('src');
  if(imageUrl){
    $('cardImage').alt=c.title||'Изображение';
    $('cardImage').src=imageUrl;
    $('cardImage').classList.add('visible');
  }

  // Для художественных карточек текст под изображением — описание/значение.
  // Для языковых карточек — пример и перевод.
  $('prompt').textContent=c.fame || c.example || '';
  $('answerText').textContent=c.exampleTranslation||'';
  $('answer').style.display='none';

  $('audio').pause();
  $('audio').removeAttribute('src');
  if(typeof c.audio==='string'){
    const audioUrl=c.audio.trim();
    if(audioUrl.startsWith('data:audio/') || audioUrl.startsWith('http://') || audioUrl.startsWith('https://')){
      $('audio').src=audioUrl;
      $('audio').load();
    }
  }
}
function chatKey(){
  return 'archiveLifeChat::'+(deck?.name||'Колода')+'::'+String(index);
}
function getChat(){try{return JSON.parse(localStorage.getItem(chatKey())||'[]')}catch(e){return []}}
function saveChat(m){try{localStorage.setItem(chatKey(),JSON.stringify(m));}catch(e){}}
function renderChat(){
  const box=$('chatMessages'); box.innerHTML='';
  const m=getChat();
  if(!m.length){const e=document.createElement('div');e.className='chat-empty';e.textContent='Здесь будет храниться вся беседа по этой карточке.';box.appendChild(e);return;}
  for(const x of m){const el=document.createElement('div');el.className='msg '+(x.role==='user'?'user':'ai');el.textContent=x.content||'';box.appendChild(el)}
  box.scrollTop=box.scrollHeight;
}
function openChat(){
  $('chatTitle').textContent='Беседа · '+(cards[index]?.title||'Карточка');
  $('chatBox').style.display='block'; renderChat(); setTimeout(()=>$('chatInput').focus(),100);
}
$('aiBtn').onclick=openChat;
$('chatClose').onclick=()=>{$('chatBox').style.display='none'};
$('chatClear').onclick=()=>{if(confirm('Удалить беседу только для этой карточки?')){localStorage.removeItem(chatKey());renderChat();}};
function systemPrompt(){
  const c=cards[index]||{};
  return 'Ты помогаешь пользователю изучать карточку из колоды «'+(deck?.name||'Колода')+'». Объясняй простым языком, как шестикласснику. Помогай понять и запомнить материал. Не выдумывай факты. Карточка: '+JSON.stringify({title:c.title,work:c.work,author:c.author,fame:c.fame,example:c.example,exampleTranslation:c.exampleTranslation,artist:c.artist,date:c.date,museum:c.museum});
}
async function sendChat(){
  const text=$('chatInput').value.trim(); if(!text)return;
  const key=$('apiKey').value.trim();
  if(!key){alert('Сначала откройте «Подключение ИИ» и вставьте ключ OpenRouter.');return;}
  const messages=getChat();
  messages.push({role:'user',content:text,ts:Date.now()}); saveChat(messages); $('chatInput').value=''; renderChat();
  $('chatSend').disabled=true; $('chatSend').textContent='…';
  try{
    const apiMessages=[{role:'system',content:systemPrompt()},...messages.map(x=>({role:x.role,content:x.content}))];
    const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model:'openai/gpt-4o-mini',messages:apiMessages,temperature:0.4})
    });
    const data=await r.json();
    if(!r.ok)throw new Error(data?.error?.message||('HTTP '+r.status));
    const answer=data?.choices?.[0]?.message?.content;
    if(!answer)throw new Error('ИИ не вернул ответ.');
    messages.push({role:'assistant',content:answer,ts:Date.now()}); saveChat(messages); renderChat();
  }catch(e){
    messages.push({role:'assistant',content:'Ошибка подключения ИИ: '+(e.message||String(e)),ts:Date.now()}); saveChat(messages); renderChat();
  }finally{$('chatSend').disabled=false;$('chatSend').textContent='Отправить';}
}
$('chatSend').onclick=sendChat;
$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}});

$('showBtn').onclick=()=>{$('answer').style.display='block';};
$('repeatBtn').onclick=()=>showCard();
$('knowBtn').onclick=()=>{
  if(index<cards.length-1){index++;showCard()}else alert('Колода закончена.');
};
$('prevBtn').onclick=()=>{if(index>0){index--;showCard()}};
$('nextBtn').onclick=()=>{if(index<cards.length-1){index++;showCard()}};
$('backDeckBtn').onclick=()=>{
  $('study').classList.add('hidden');$('browser').classList.remove('hidden');
  loadFolder(currentPath,$('locationTitle').textContent);
};
loadFolder(DECK_ROOT,'КОЛОДЫ');
})();
</script>
</body>
</html>
